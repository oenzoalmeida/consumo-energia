name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check calc.js
      - name: Testes das regras de cálculo
        run: node --test tests/calc.test.js
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f calc.js

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: consumo_test
          POSTGRES_USER: consumo
          POSTGRES_PASSWORD: consumo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consumo -d consumo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://consumo:consumo@localhost:5432/consumo_test
      JWT_SECRET: ci-placeholder-nao-usar-em-producao
      PORT: '10000'
      FRONTEND_URL: 'https://consumo-energia-2.web.app,https://consumo-energia.pages.dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security regression tests
        run: node --test security.test.js maintenance.test.js
        working-directory: backend
      - name: Provision authentication limiter
        working-directory: backend
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_auth_rate_limit.sql
      - name: PostgreSQL limiter integration tests
        run: node --test security.integration.test.js
      - name: Seed forced-change fixture (schema + migration 002, sem dump)
        working-directory: backend
        run: node scripts/seed-forced-change-fixture.mjs
      - name: Forced change E2E
        working-directory: backend
        run: node e2e-forced-change.test.mjs
      - name: Reset rate limiter state
        working-directory: backend
        run: psql "$DATABASE_URL" -c "DELETE FROM auth_rate_limit"
      - name: Syntax check
        run: node --check server.js
      - name: Start server and smoke test /health
        run: |
          node server.js &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:10000/health || true)
            if [ "$code" = "200" ]; then echo "GET /health -> 200"; exit 0; fi
            sleep 1
          done
          echo "Servidor não respondeu 200 em /health a tempo"; exit 1
      - name: Rate limit responde 429 após estourar a cota
        run: |
          for i in $(seq 1 15); do
            curl -s -o /dev/null -X POST -H "Content-Type: application/json" -d '{"email":"ci@test.local","password":"nao-importa"}' http://localhost:10000/api/auth/login
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"email":"ci@test.local","password":"nao-importa"}' http://localhost:10000/api/auth/login)
          echo "16a requisicao -> $code"
          [ "$code" = "429" ]
      - name: Smoke CORS multi-origin (reflete origem da lista, sem wildcard)
        run: |
          for origin in https://consumo-energia-2.web.app https://consumo-energia.pages.dev; do
            acao=$(curl -s -D - -o /dev/null http://localhost:10000/health -H "Origin: $origin" | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
            echo "Origin $origin -> Access-Control-Allow-Origin: $acao"
            test "$acao" = "$origin"
          done
          acao=$(curl -s -D - -o /dev/null http://localhost:10000/health -H 'Origin: https://origem-nao-autorizada.example.com' | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
          echo "Origem fora da lista -> Access-Control-Allow-Origin: '$acao'"
          test -z "$acao"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://localhost:10000/api/data \
            -H 'Origin: https://consumo-energia.pages.dev' \
            -H 'Access-Control-Request-Method: PUT')
          acao=$(curl -s -D - -o /dev/null -X OPTIONS http://localhost:10000/api/data \
            -H 'Origin: https://consumo-energia.pages.dev' \
            -H 'Access-Control-Request-Method: PUT' | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
          echo "Preflight OPTIONS (pages.dev) -> $code, Access-Control-Allow-Origin: $acao"
          test "$code" = "204"
          test "$acao" = "https://consumo-energia.pages.dev"
