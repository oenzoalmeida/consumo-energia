<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Consumo de Energia 2.0</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:980px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.card{background:#fff;border:1px solid #dce4ed;border-radius:18px;padding:22px;box-shadow:0 12px 35px rgba(20,40,70,.08)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5eaf0}button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}.primary{background:#1d4ed8;color:#fff}.muted{background:#eef3f8}.badge{padding:4px 8px;border-radius:999px;background:#eef3f8;font-size:12px}.status{margin:12px 0;color:#64748b}@media(max-width:700px){table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{padding:12px 0;border-bottom:1px solid #e5eaf0}td{border:0;padding:5px 0}}</style></head><body><div class="wrap"><header><div><h1>Painel administrativo</h1><p>Gestão de contas do Consumo de Energia 2.0.</p></div><button id="logout" class="muted">Sair</button></header><section class="card"><div id="status" class="status">Carregando...</div><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ação</th></tr></thead><tbody id="users"></tbody></table></section></div><script>
const API='https://consumo-energia-backend.vercel.app';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const d=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw new Error(d?.error||'Erro');return d;}
async function load(){try{const me=await req('/api/auth/me');if(me.user.role!=='ADMIN'){location.href='./';return;}const data=await req('/api/admin/users');document.getElementById('status').textContent=`${data.users.length} conta(s)`;document.getElementById('users').innerHTML=data.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.role)}</span></td><td>${u.active?'Ativo':'Inativo'}</td><td><button class="${u.active?'muted':'primary'}" data-id="${esc(u.id)}" data-active="${u.active}">${u.active?'Desativar':'Ativar'}</button></td></tr>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await req('/api/admin/users/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({active:b.dataset.active!=='true'})});load();});}catch{location.href='./';}}
document.getElementById('logout').onclick=async()=>{try{await req('/api/auth/logout',{method:'POST'});}catch{}location.href='./';};load();
</script></body></html>
